name: Deploy to FiveM Server

on:
  push:
    branches: [ main, develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy and apply SQL on Windows host
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            powershell -NoProfile -ExecutionPolicy Bypass -Command "
              $root = 'C:\fivem_server2';
              Set-Location $root;

              # 最新反映
              git reset --hard;
              git pull origin '${{ github.ref_name }}';

              # Secrets をセッション環境変数へ
              $env:MYSQL_HOST='${{ secrets.MYSQL_HOST }}';
              $env:MYSQL_PORT='${{ secrets.MYSQL_PORT }}';
              $env:MYSQL_USER='${{ secrets.MYSQL_USER }}';
              $env:MYSQL_PASS='${{ secrets.MYSQL_PASS }}';
              $env:MYSQL_DB='${{ secrets.MYSQL_DB }}';

              # mysql クライアントの場所（入ってない/Path未設定対策）
              $mysql = 'mysql';
              $cands = @(
                'C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe',
                'C:\Program Files\MySQL\MySQL Server 5.7\bin\mysql.exe',
                'C:\xampp\mysql\bin\mysql.exe'
              );
              foreach($c in $cands){ if(Test-Path $c){ $mysql = $c; break } }

              Write-Host '--- SQL scan start ---';
              # リポジトリ配下すべてから *.sql を再帰で取得（名前順で実行）
              $files = Get-ChildItem -Path $root -Recurse -Filter *.sql | Sort-Object FullName;
              if(-not $files){ Write-Host 'No SQL files found.'; exit 0 }

              foreach($f in $files){
                Write-Host ('Running: ' + $f.FullName);
                & $mysql `
                  -h $env:MYSQL_HOST `
                  -P $env:MYSQL_PORT `
                  -u $env:MYSQL_USER `
                  ('-p' + $env:MYSQL_PASS) `
                  $env:MYSQL_DB < $f.FullName
                if($LASTEXITCODE -ne 0){ throw 'MySQL apply failed: ' + $f.FullName }
              }
              Write-Host '--- SQL apply done ---';
            "

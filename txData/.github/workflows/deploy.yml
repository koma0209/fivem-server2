name: Deploy to FiveM Server

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy and apply SQL on server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "✅ サーバーに接続しました"
            cd C:/fivem_server2
            git reset --hard
            git pull origin ${{ github.ref_name }}
            echo "📂 最新ファイルを取得しました"

            # SQLフォルダ内を全部実行
            for %f in (sql\*.sql) do (
              echo ▶️ 実行中: %f
              mysql -h ${{ secrets.MYSQL_HOST }} -P ${{ secrets.MYSQL_PORT }} ^
                -u ${{ secrets.MYSQL_USER }} -p${{ secrets.MYSQL_PASS }} ^
                ${{ secrets.MYSQL_DB }} < %f
            )

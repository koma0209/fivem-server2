name: Deploy to FiveM Server

on:
  push:
    branches: [ main, develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy and apply SQL on server (Windows via SSH)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo ===== CONNECTED =====

            REM 1) 最新化（develop をそのまま反映）
            cd /d C:\fivem_server2
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}
            echo ✅ Pulled latest: ${{ github.ref_name }}

            REM 2) PowerShellで .sql を再帰実行
            powershell -NoProfile -ExecutionPolicy Bypass -Command ^
              "$mysql = 'C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe'; ^
               if (-not (Test-Path $mysql)) { Write-Error 'mysql.exe not found'; exit 1 } ; ^
               $sqlFiles = Get-ChildItem -Path 'C:\fivem_server2' -Recurse -Filter *.sql; ^
               if ($sqlFiles.Count -eq 0) { Write-Host 'No .sql files found. Skip.'; exit 0 } ; ^
               foreach ($f in $sqlFiles) { ^
                 Write-Host ('▶️ Running: ' + $f.FullName); ^
                 & $mysql -h $env:MYSQL_HOST -P $env:MYSQL_PORT -u $env:MYSQL_USER -p$env:MYSQL_PASS $env:MYSQL_DB < $f.FullName ^
                 ; if ($LASTEXITCODE -ne 0) { Write-Error ('MySQL failed on ' + $f.FullName); exit 1 } ^
               } ; ^
               Write-Host '✅ All SQL applied.'"

        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASS: ${{ secrets.MYSQL_PASS }}
          MYSQL_DB:   ${{ secrets.MYSQL_DB }}

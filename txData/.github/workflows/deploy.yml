name: Deploy to FiveM Server

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: {}  # 手動実行も可

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for Actions metadata only)
        uses: actions/checkout@v4

      - name: Deploy & Apply SQL on Windows host (PowerShell)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            Write-Host "✅ Connected via SSH"
            $repoPath = 'C:\fivem_server2'
            $sqlDir   = Join-Path $repoPath 'sql'
            $mysqlExe = 'C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe'

            Set-Location $repoPath

            # ローカル変更でつっかえないよう必ず上書き
            git reset --hard
            git clean -fd

            # いま push されたブランチ名で pull
            git pull origin "$env:GITHUB_REF_NAME"
            Write-Host "📂 Pulled latest: $env:GITHUB_REF_NAME"

            # SQL 全実行（あれば）
            if (Test-Path $mysqlExe -PathType Leaf -ErrorAction SilentlyContinue) {
              if (Test-Path $sqlDir) {
                Get-ChildItem $sqlDir -Filter *.sql -File | ForEach-Object {
                  Write-Host "▶️ Apply SQL: $($_.FullName)"
                  & "$mysqlExe" -h ${{ secrets.MYSQL_HOST }} -P ${{ secrets.MYSQL_PORT }} `
                    -u ${{ secrets.MYSQL_USER }} -p"${{ secrets.MYSQL_PASS }}" `
                    ${{ secrets.MYSQL_DB }} < $_.FullName
                }
              } else {
                Write-Host "ℹ️ No sql directory. Skipping SQL."
              }
            } else {
              Write-Host "⚠️ MySQL client not found. Skipping SQL."
            }

            # （任意）FXServer再起動。txAdminの自動再起動運用なら不要。
            # Get-Process FXServer -ErrorAction SilentlyContinue | Stop-Process -Force
            # Start-Process -FilePath "$repoPath\server\FXServer.exe"
            # Write-Host "🚀 FXServer restarted"
